name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Require npm with trusted publishing support
        run: npm install -g "npm@^11.5.1"
      - run: npm ci
      - run: npm test
      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
      # The same code ships under two names: the scoped package for library imports and the short
      # living-docs-axi for npx, which also avoids any scope-to-registry mapping on the user's side.
      # Each step skips a version that is already on npm, so a half-finished release can be re-run.
      - name: Publish @bytesbybrandon/living-docs with provenance
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
      - name: Publish living-docs-axi with provenance
        run: |
          npm pkg set name=living-docs-axi
          version=$(node -p "require('./package.json').version")
          if npm view "living-docs-axi@$version" version >/dev/null 2>&1; then
            echo "living-docs-axi@$version is already on npm"
          else
            npm publish --provenance --access public
          fi
